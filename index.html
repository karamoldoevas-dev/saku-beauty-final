<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fbf6ef" />
    <title>SAKU BEAUTY — косметика, парфюмерия и уход | Бишкек</title>

    <!-- Для поиска Google: описание и ключевые слова -->
    <meta name="description" content="SAKU BEAUTY — интернет-магазин премиальной косметики: уход за кожей, макияж, парфюмерия и уход за телом. Доставка по Бишкеку и Кыргызстану. Сайт на русском, кыргызском и английском." />
    <meta name="keywords" content="SAKU BEAUTY, саку бьюти, косметика Бишкек, парфюмерия, уход за кожей, макияж, интернет-магазин косметики Кыргызстан" />
    <meta name="author" content="SAKU BEAUTY" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://saku-beauty-final.vercel.app/" />

    <!-- Красивое превью, когда ссылку отправляют в Telegram, WhatsApp, Instagram -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SAKU BEAUTY" />
    <meta property="og:title" content="SAKU BEAUTY — Beauty in Every Detail" />
    <meta property="og:description" content="Премиальная косметика и парфюмерия. Уход за кожей, макияж, ароматы. Доставка по Кыргызстану." />
    <meta property="og:url" content="https://saku-beauty-final.vercel.app/" />
    <meta property="og:image" content="https://saku-beauty-final.vercel.app/photos/coll-perfume.jpg" />
    <meta property="og:locale" content="ru_RU" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Иконка во вкладке браузера -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Ставим тему устройства (день/ночь) ещё до загрузки React, чтобы ночью не было белой вспышки
      try {
        var th = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = th
        document.querySelector('meta[name="theme-color"]').content = th === 'dark' ? '#150b10' : '#fbf6ef'
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
